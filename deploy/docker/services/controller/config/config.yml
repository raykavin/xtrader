# The configuration of the controller in its container, mounted at
# /app/config/config.yml: only what it needs to start and to reach PostgreSQL
# (the service postgres). The agents, their accounts, their language models
# and prompts, the users of the dashboard and Telegram are in the database,
# changed on the page of the settings of the dashboard. The ${VAR} come from
# services/controller/.env, which install.sh fills: never a secret here. They
# replace the text before the YAML is read, so each stays between single
# quotes, which take a value of any character but '.
listen: 0.0.0.0:8080

database:
  dsn: 'postgres://xtrader:${XTRADER_DB_PASSWORD}@postgres:5432/xtrader?sslmode=disable'
  max_open_conns: 10
  log_level: warn

# the key of the secrets of the database (the API keys and the tokens): the
# same in services/migrator/.env. Lost, the secrets have to be set again.
secrets_key: '${XTRADER_SECRETS_KEY}'

# the first user of the dashboard, created while the database has none
bootstrap:
  username: '${XTRADER_BOOTSTRAP_USERNAME}'
  password: '${XTRADER_BOOTSTRAP_PASSWORD}'

# the bundle of the dashboard, in the image
ui:
  dir: /app/web
  # the proxies whose X-Forwarded-For and X-Forwarded-Proto are believed: ngrok
  # on the host reaches the published port through the gateway of the network
  # of the compose (eg: 172.18.0.1), in the private range of Docker. Safe
  # with the port published on the loopback of the host only (127.0.0.1:8082,
  # the compose), and see `docker network inspect xtrader` if the network has
  # another range
  trusted_proxies:
    - 127.0.0.0/8
    - 172.16.0.0/12

agents:
  # the internal API of the agents, on the loopback of the container
  api: 127.0.0.1:8090
  # their data in /app/data (the volume services/controller/data): their outboxes
  dir: /app
  commands:
    llm: /app/bin/llmagent
    trend: /app/bin/trendagent
    momentum: /app/bin/momentumagent
    breakout: /app/bin/breakoutagent
    intraday: /app/bin/intradayagent
  stop_timeout: 20s

log:
  level: info
