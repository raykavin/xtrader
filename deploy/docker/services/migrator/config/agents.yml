# The agents to import into the database of the controller in its container,
# once, in the format of the previous version (the agents.yml the controller
# read before the database), mounted at /app/config/agents.yml of the service
# migrator:
#
#	docker compose run --rm migrator migrator -config /app/config/config.yml \
#		import -agents /app/config/agents.yml -dry-run    # what it would import
#	docker compose run --rm migrator migrator -config /app/config/config.yml \
#		import -agents /app/config/agents.yml
#
# Each agent becomes one of the database, its flags split into its columns
# (mode, API, account, language model, prompt by its name) and its params; an
# agent there already is kept as it is. The secrets aren't here: set them on
# the page of the settings of the dashboard (the API key of the LLM, the tokens
# of the bridge, MT5_BRIDGE_TOKEN of services/mt5/.env, and of the MCP server
# of the terminal), or import them with -env from an environment file of the
# previous version.
#
# The terminal of MT5 is the service mt5 of the compose: its bridge at
# http://mt5:18812 and the MCP server of the terminal (the economic calendar)
# at http://mt5:22347/mcp. Never run the same agent here and on another
# machine at once: they would trade the same account with the same magic
# number.
agents:
  # The LLM strategy (ChatGPT) on BTCUSDm and XAUUSDm, as it ran on the host:
  # the prompt trend_following (-prompt-path, imported as the prompt of its
  # name) on 30m with the trend of 4h required, without take profit, gpt-5 with
  # a low reasoning effort, operated from the dashboard and from Telegram.
  - name: llm
    enabled: true
    address: localhost:5580
    exec: /app/bin/llmagent
    args:
      - -llm-provider openai -llm-model gpt-5 -llm-reasoning low -llm-candles 60
      - -prompt-path agents/llm/prompts/trend_following.txt
      - -llm-setup free -llm-max-spread-atr 0.2
      - -llm-min-stop-atr 1 -llm-higher-trend-required
      - -llm-higher-timeframes 4h -llm-correlated USTECm,XAUUSDm,DXYm
      - >-
        -mode live -exchange mt5 -mt5-bridge http://mt5:18812
        -pair BTCUSDm,XAUUSDm -timeframe 30m -lot 0.03,0.01 -leverage 400
        -calendar-mcp http://mt5:22347/mcp -calendar-importance high
        -trade-panel -telegram-control
      - -api localhost:5580
    restart: true

  # A strategy of the agents on the same terminal, eg: matrend on BTCUSDm 5m
  # (agents/trendagent), off: enabled: true to run it.
  - name: matrend-btc
    enabled: false
    address: localhost:5570
    exec: /app/bin/trendagent
    args:
      - >-
        -mode live -exchange mt5 -mt5-bridge http://mt5:18812
        -pair BTCUSDm -timeframe 5m -lot 0.01 -leverage 20
        -stop-value 1 -take-profit-value 2
        -telegram-control
      - -strategy matrend -max-distance 0.5
      - -api localhost:5570
    restart: true
