<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- the icon of XTrader for the README: the X of the logo (web/src/components/Logo.tsx,
       two candles crossed) on a tile in the colors of the dark theme of the dashboard -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202e"/>
      <stop offset="1" stop-color="#070c14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#3aa0dc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3aa0dc" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="11.6" y="4.6" width="8.8" height="22.8" rx="2.4" transform="rotate(45 16 16)" fill="#000"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#1f2c3d" stroke-width="1.5"/>
  <g transform="translate(25.6 25.6) scale(6.4)" stroke-linecap="round" stroke-width="2.2">
    <g mask="url(#cut)">
      <g transform="rotate(-45 16 16)">
        <line x1="16" y1="1.5" x2="16" y2="30.5" stroke="#f05252"/>
        <rect x="13" y="6" width="6" height="20" rx="1.4" fill="#f05252"/>
      </g>
    </g>
    <g transform="rotate(45 16 16)">
      <line x1="16" y1="1.5" x2="16" y2="30.5" stroke="#10b981"/>
      <rect x="13" y="6" width="6" height="20" rx="1.4" fill="#10b981"/>
    </g>
  </g>
</svg>
