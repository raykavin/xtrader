# The configuration of the controller (cmd/controller) and of the migrations
# (cmd/migrator) on the host: only what they need to start and to reach
# PostgreSQL. The agents, their accounts, their language models and prompts,
# the users of the dashboard and Telegram are in the database, changed on the
# page of the settings of the dashboard (or imported once from the previous
# version, see cmd/migrator).
#
# Copy it to configs/config.yml, which git ignores. The ${VAR} are read from the
# environment of the controller, the secrets never written here. They replace
# the text before the YAML is read, so each stays between single quotes, which
# take a value of any character but '. One without a value would be read as
# nothing: the controller (and cmd/migrator) refuses to start when one of
# database.dsn or secrets_key isn't set or is empty, or when an entry of the
# env of a service is left empty, eg: MT5_BRIDGE_TOKEN, without which the
# bridge accepts any process of the host; any other one not set is a warning
# of the log, but the ones of bootstrap, removed once logged in:
#
#	export XTRADER_DB_PASSWORD='...'                           # of the user xtrader of PostgreSQL
#	export XTRADER_SECRETS_KEY="$(head -c 32 /dev/urandom | base64)"  # once, kept: it encrypts the secrets
#	export MT5_BRIDGE_TOKEN='...'                              # of the bridge of MT5 on the host (services)
#	go run ./cmd/migrator -config configs/config.yml up        # the schema and the seeds
#	go run ./cmd/controller -config configs/config.yml

# the web dashboard, behind a reverse proxy with HTTPS for access from outside
listen: localhost:8082

database:
  dsn: 'postgres://xtrader:${XTRADER_DB_PASSWORD}@localhost:5432/xtrader?sslmode=disable'
  max_open_conns: 10
  max_idle_conns: 10
  conn_max_lifetime: 1h
  # the queries logged: silent, error or warn (the slow ones), never their values
  log_level: warn

# the key of the secrets of the database (the API keys and the tokens,
# AES-256-GCM): 32 bytes in base64. Lost, the secrets have to be set again.
secrets_key: '${XTRADER_SECRETS_KEY}'

# the SQL of cmd/migrator
migrations:
  path: sql/migrations
  seeds: sql/seeds

# the first user of the dashboard, created while the database has none: remove
# the variables once logged in, the other users are made on the settings
bootstrap:
  username: '${XTRADER_BOOTSTRAP_USERNAME}'
  password: '${XTRADER_BOOTSTRAP_PASSWORD}'

# the dashboard: the local build of web/ (cd web && bun run build), or else a
# release, the one of the binary by default (version: vX.Y.Z or latest)
ui:
  dir: web/dist
  # version: latest
  # the reverse proxies in front of the dashboard (IPs or CIDRs), eg: ngrok on
  # this host: only their X-Forwarded-For and X-Forwarded-Proto are believed,
  # for the address of the client (logs and limits of the logins) and the
  # Secure cookies. The loopback by default; never a range clients come from
  # trusted_proxies:
  #   - 127.0.0.0/8
  #   - ::1/128

agents:
  # the internal API the agents take their settings from and keep their
  # records through: on the loopback only, never published
  api: 127.0.0.1:8090
  # the working directory of the agents: their outboxes in data/outbox, and
  # the pidfiles of the processes of the controller in data/pids (one
  # controller per dir: a second one doesn't start)
  dir: .
  # the command of each kind of agent, bin/<kind>agent by default
  commands:
    llm: go run ./agents/llm/llmagent
    trend: go run ./agents/trendagent
    momentum: go run ./agents/momentumagent
    breakout: go run ./agents/breakoutagent
    intraday: go run ./agents/intradayagent
  # the environment of the agents is PATH, HOME, USER, LOGNAME, TZ, LANG,
  # LC_ALL and TMPDIR, plus these, never a secret: they get theirs from the
  # controller
  # env:
  #   - GOFLAGS=-mod=mod
  # how long an agent stopped has before it is killed
  stop_timeout: 20s

# the processes the agents need, launched before them and stopped after them:
# the bridge of MT5 on the host, the token it requires (the agents have theirs
# in the database). Their environment is PATH, HOME, USER, LOGNAME, TZ, LANG,
# LC_ALL and TMPDIR plus their env, never the env of the agents nor the rest
# of the environment of the controller
services:
  - name: mt5bridge
    exec: tools/mt5bridge/run.sh
    health: http://127.0.0.1:18812/health
    restart: true
    # how long it has to stop once interrupted before it is killed, 10s by
    # default
    # stop_timeout: 10s
    env:
      - 'MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN}'

# the whole stop of the controller (SIGINT or SIGTERM): the agents (their
# stop_timeout), then the services (theirs); past it, whatever still runs is
# killed. By default agents.stop_timeout + the longest stop_timeout of the
# services + 10s (40s here), never under that sum + 3s: each phase, the agents
# then the services, may wait 1s more for the output of a process killed, eg:
# held by the X server the script of the bridge starts. Who stops the
# controller waits for it longer: tools/automator.sh (AUTOMATOR_STOP_TIMEOUT,
# 300s by default), the stop_grace_period of a compose, the TimeoutStopSec of
# a systemd unit. On Linux the agents and the services stop with the
# controller even when it is killed, and the next start stops what was left
# running before it launches anything (data/pids of agents.dir)
# shutdown_timeout: 40s

log:
  level: info
