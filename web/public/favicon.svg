<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- the X of the logo (src/components/Logo.tsx), in the colors of the theme of the browser -->
  <style>
    .bull { fill: #2dd4bf; stroke: #2dd4bf; }
    .bear { fill: #fb7185; stroke: #fb7185; }
    line { stroke-width: 2.2; stroke-linecap: round; }
    @media (prefers-color-scheme: light) {
      .bull { fill: #0d9488; stroke: #0d9488; }
      .bear { fill: #e11d48; stroke: #e11d48; }
    }
  </style>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="11.6" y="4.6" width="8.8" height="22.8" rx="2.4" transform="rotate(45 16 16)" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <g class="bear" transform="rotate(-45 16 16)">
      <line x1="16" y1="1.5" x2="16" y2="30.5"/>
      <rect x="13" y="6" width="6" height="20" rx="1.4" stroke="none"/>
    </g>
  </g>
  <g class="bull" transform="rotate(45 16 16)">
    <line x1="16" y1="1.5" x2="16" y2="30.5"/>
    <rect x="13" y="6" width="6" height="20" rx="1.4" stroke="none"/>
  </g>
</svg>
